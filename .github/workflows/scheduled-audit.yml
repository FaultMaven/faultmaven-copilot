name: Scheduled Dependency Audit

# =============================================================================
# DAILY AUDIT OF MAIN (faultmaven#2159)
# =============================================================================
# The PR gate (ci.yml `security`, "Security Scan") audits only what a pull
# request or a push carries. Without this run, an advisory published against
# main's unchanged lockfile first turns red on whichever PR or merge comes
# next. This audits main every day through the same lockfile-audit action, so
# it uses the gate's level by construction.
#
# It always fails when npm's advisory endpoint stays unreachable: a scheduled
# run that never audited must not read as clean. A failure emails whoever last
# edited the cron line, and core's Security-tab sweep
# (faultmaven scripts/security_alert_sweep.py) reports this workflow's latest
# scheduled run every round.
# =============================================================================

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/scheduled-audit.yml'
      - '.github/actions/lockfile-audit/**'

# The versions ci.yml's `env` uses for the same audit.
env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

permissions:
  contents: read

jobs:
  audit:
    name: Scheduled Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Audit lockfile (fails if the audit could not run)
        uses: ./.github/actions/lockfile-audit
        with:
          on-unreachable: fail
