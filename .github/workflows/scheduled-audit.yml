name: Scheduled Dependency Audit

# =============================================================================
# DAILY AUDIT OF MAIN (faultmaven#2159)
# =============================================================================
# The PR gate (ci.yml `security`, "Security Scan") audits only what a pull
# request or a push carries. Without this run, an advisory published against
# main's unchanged lockfile first turns red on whichever PR or merge comes
# next. This audits main every day through the same lockfile-audit action, so
# it uses the gate's level by construction.
#
# It always fails when the audit could not run (npm's advisory endpoint
# unreachable, failing or stalled for all four attempts): a scheduled run that
# never audited must not read as clean. Core's Security-tab sweep
# (faultmaven scripts/security_alert_sweep.py) reports this workflow's latest
# scheduled run every round, and counts it as failing when it failed or is
# over two days old. GitHub may also email a failed scheduled run to whoever
# last edited the cron line, under that account's notification settings.
#
# A dispatch audits the ref it is started from; only the schedule audits main.
# GitHub disables a public repository's schedules after 60 days without
# activity, which the sweep then reports as stale; re-enable it from the
# Actions tab.
# =============================================================================

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/scheduled-audit.yml'
      - '.github/actions/lockfile-audit/**'

permissions:
  contents: read

jobs:
  audit:
    name: Scheduled Dependency Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: package.json

      - name: Audit lockfile (fails if the audit could not run)
        uses: ./.github/actions/lockfile-audit
        with:
          on-unreachable: fail
