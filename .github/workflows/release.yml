name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'  # Matches semantic version tags like v1.2.3

env:
  SERVICE_NAME: faultmaven-copilot

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read  # the CI-verdict lookup below

    steps:
      # A tag names a commit; nothing else here says CI passed on it. v1.0.2
      # and v1.0.3 were released 2-3 minutes before their own CI runs
      # finished. This step waits for a green "CI/CD Pipeline" push run of the
      # tagged commit and refuses one that has none. CI on a push has taken
      # up to 313s (60 runs to 2026-10-23), so it waits up to 10 minutes.
      - name: Require a green CI run of the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            conclusions="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&event=push&per_page=100" \
              --jq '[.workflow_runs[] | .conclusion // "pending"] | join(" ")')"
            echo "attempt ${attempt}: CI push runs of ${GITHUB_SHA}: '${conclusions}'"
            # No run at all yet waits like a pending one: the tag can reach
            # GitHub before the push to main that starts CI.
            case " ${conclusions:-pending} " in
              *" success "*) exit 0 ;;
              *" pending "*) sleep 30 ;;
              *) break ;;
            esac
          done
          echo "::error::${GITHUB_SHA} has no successful CI/CD Pipeline push run; push the commit to main, let CI pass, then re-run this release"
          exit 1

      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0  # Fetch all history for changelog generation

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: '9'

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      # `wxt zip` does NOT run the package.json `prebuild` hook (there is no
      # `prezip` script), so icons must be generated explicitly.
      - name: Generate icons
        run: pnpm run generate-icons

      # `pnpm zip` / `pnpm zip:firefox` build AND package: WXT names the
      # artifact <name>-<version>-<target>.zip from package.json's version —
      # the same versioned filename README.md tells users to download.
      - name: Build and package Chrome extension
        run: pnpm zip

      - name: Build and package Firefox extension
        run: pnpm zip:firefox

      # The tag names the release; package.json (via WXT) versions the built
      # manifest. Nothing else ties the two together, so assert it here:
      # a tag pushed without the matching package.json bump must fail the
      # release, not publish mislabeled artifacts that the Chrome Web Store
      # then rejects for a non-increasing version. Comparing the BUILT
      # manifests (not package.json) also catches WXT's silent fallbacks —
      # e.g. version 0.0.0 when package.json's version is missing, or a
      # prerelease suffix being stripped.
      - name: Verify built manifest versions match the tag
        run: |
          TAG_VERSION="${{ steps.version.outputs.version }}"
          # Prerelease-suffixed tags are rejected outright rather than compared
          # against WXT's suffix-stripped manifest version: a store manifest
          # cannot carry the suffix, so a v1.2.0-rc.1 build produces manifest
          # 1.2.0 — colliding with the eventual final at both CWS and AMO —
          # and Chrome/Firefox zips get different {{version}} names (only
          # Chromium receives version_name). This workflow cuts full releases
          # only (everything it publishes shows as "Latest release"), so
          # there is no rc lane: cut a plain distinct version instead.
          case "$TAG_VERSION" in
            *-*)
              echo "::error::Prerelease-suffixed tags are unsupported: WXT strips the suffix from the manifest, so the rc would collide with its final at store upload — and this workflow publishes full releases only. Cut a plain distinct version instead (bump the patch)."
              exit 1
              ;;
          esac
          CHROME_VERSION=$(node -p "require('./.output/chrome-mv3/manifest.json').version")
          FIREFOX_VERSION=$(node -p "require('./.output/firefox-mv2/manifest.json').version")
          echo "tag=$TAG_VERSION chrome=$CHROME_VERSION firefox=$FIREFOX_VERSION"
          if [ "$CHROME_VERSION" != "$TAG_VERSION" ] || [ "$FIREFOX_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Built manifest version does not match tag v$TAG_VERSION (chrome=$CHROME_VERSION, firefox=$FIREFOX_VERSION). Bump package.json's version to $TAG_VERSION and re-tag."
            exit 1
          fi

      # Multi-line outputs MUST use the delimiter syntax — a bare `notes=` line
      # followed by plain lines is rejected by the runner ("Invalid format"),
      # which would fail the job on every tag push.
      - name: Generate release notes
        id: release-notes
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION="${{ steps.version.outputs.version }}"
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          {
            echo "notes<<NOTES_EOF"
            echo "## What's Changed"
            if [ -z "$PREV_TAG" ]; then
              echo "Initial release"
            else
              git log --pretty=format:"- %s (%h)" ${PREV_TAG}..${TAG} || echo "- See commit history"
              echo ""
            fi
            echo ""
            echo "## Installation"
            echo ""
            echo "### Chrome/Edge"
            echo "1. Download \`faultmaven-copilot-${VERSION}-chrome.zip\`"
            echo "2. Extract the archive"
            echo "3. Go to \`chrome://extensions\`"
            echo "4. Enable Developer mode"
            echo "5. Click Load unpacked and select the extracted folder"
            echo ""
            echo "### Firefox"
            echo "1. Download \`faultmaven-copilot-${VERSION}-firefox.zip\`"
            echo "2. Extract the archive"
            echo "3. Go to \`about:debugging#/runtime/this-firefox\`"
            echo "4. Click Load Temporary Add-on and select any file in the extracted folder"
            echo "NOTES_EOF"
          } >> $GITHUB_OUTPUT

      # Explicit versioned filenames — NOT `.output/*.zip`, which would also
      # publish the Firefox sources zip that `wxt zip -b firefox` emits.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            .output/faultmaven-copilot-${{ steps.version.outputs.version }}-chrome.zip
            .output/faultmaven-copilot-${{ steps.version.outputs.version }}-firefox.zip
          name: Release ${{ steps.version.outputs.version }}
          body: ${{ steps.release-notes.outputs.notes }}
          draft: false
          # A path that stops matching WXT's artifact naming must fail the
          # release, not publish one with zero assets (the action's default).
          fail_on_unmatched_files: true
          # No `prerelease:` flag: suffixed tags are rejected by the verify
          # step above, so every release that reaches this step is a full one.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        run: |
          echo "### ✅ Release Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tag**: ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Release artifacts:" >> $GITHUB_STEP_SUMMARY
          echo "- \`faultmaven-copilot-${{ steps.version.outputs.version }}-chrome.zip\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`faultmaven-copilot-${{ steps.version.outputs.version }}-firefox.zip\`" >> $GITHUB_STEP_SUMMARY
