name: Brand Lint

# Enforces FaultMaven's canonical product terminology in brand-facing files.
# Source of truth: faultmaven repo, .claude/skills/brand-messaging.md (§3/§7).
# Pure Node stdlib — nothing to install.

on:
  pull_request:
    paths:
      # Must list every file the script scans (UNIVERSAL_FILES / CORE_FILES) —
      # a path missing here means the job never runs on the PR that breaks it,
      # and the violation surfaces only on the post-merge push.
      - "README.md"
      - "PRIVACY.md"
      - "package.json"
      - "public/_locales/en/messages.json"
      - "scripts/brand-lint.mjs"
      - ".github/workflows/brand-lint.yml"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  brand-lint:
    runs-on: ubuntu-latest
    # Checks out the repository and runs a Node stdlib script over committed
    # files. Reports through the step's exit code — no comment, no API call.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run brand-messaging lint
        run: node scripts/brand-lint.mjs
