name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  SERVICE_NAME: faultmaven-copilot

# Floor for the whole workflow: read the repository and nothing else. Every
# job below states its own block; this one is what a job added later without
# one would inherit, so a new job cannot silently pick up whatever the
# repository default happens to be at the time.
permissions:
  contents: read

jobs:
  # ============================================================================
  # Stage 1: Lint & Type Check
  # ============================================================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Checks out the repository and runs tsc. Writes only to
    # $GITHUB_STEP_SUMMARY, which is a runner file, not an API scope.
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run compile

      - name: Lint summary
        if: success()
        run: |
          echo "### ✅ Lint & Type Check Passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "TypeScript compilation successful. No type errors found." >> $GITHUB_STEP_SUMMARY

      - name: Lint failure
        if: failure()
        run: |
          echo "### ❌ Lint & Type Check Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Type checking failed. Fix type errors before proceeding." >> $GITHUB_STEP_SUMMARY
          exit 1

  # ============================================================================
  # API type drift
  # `packages/copilot-ui/types/api.generated.ts` is generated from faultmaven's committed
  # OpenAPI spec. Nothing previously compared the two, so the file could sit
  # arbitrarily far behind the API it claims to describe — and did: it declared
  # an endpoint the server had removed. Regenerating and diffing is the whole
  # check; there is no hand-maintained list to curate.
  #
  # This is the client half of faultmaven's own `api-contract-drift` job
  # (fm#880). That one keeps the spec honest about the app; this one keeps the
  # generated client honest about the spec.
  # ============================================================================
  api-types-drift:
    name: API Types Drift Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Checks out this repository. The pinned contract is fetched over
    # unauthenticated raw.githubusercontent.com; the hop report below does
    # send GITHUB_TOKEN, for the rate limit only — `contents: read` on this
    # repository is all it ever grants, and the files it reads are public.
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Two commits, so `HEAD^` exists on a push. At the default depth
          # of 1 the hop report's push arm could never resolve a base and
          # was permanently silent — losing the post-merge record of what a
          # pin bump crossed, which is the durable half of the disclosure.
          fetch-depth: 2

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The PINNED contract, not `main`. Fetching `main` meant the API
      # repository publishing a change reached this client the moment it
      # merged — turning this repository red with no commit here recording
      # that anyone accepted it. Adoption is moving `ref` in
      # api-contract.pin.json, and that PR is where this side says yes.
      - name: Fetch the pinned API contract
        run: |
          set -euo pipefail
          REPO=$(node -p "require('./api-contract.pin.json').repository")
          REF=$(node -p "require('./api-contract.pin.json').ref")
          echo "Contract: ${REPO}@${REF}"
          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors \
            "https://raw.githubusercontent.com/${REPO}/${REF}/docs/reference/api/openapi.json" \
            -o /tmp/openapi.json
          # A truncated or error-page download would regenerate an empty client
          # and the diff below would "pass" by matching nothing.
          python3 -c "import json,sys; d=json.load(open('/tmp/openapi.json')); sys.exit(0 if d.get('paths') else 1)"
          # The pin names a contract version as well as a ref. If they
          # disagree the ref is not the commit whoever wrote this file meant,
          # and the client would be generated from a contract nobody reviewed.
          PINNED_VERSION=$(node -p "require('./api-contract.pin.json').contractVersion")
          FETCHED_VERSION=$(node -p "require('/tmp/openapi.json').info.version")
          if [ "${PINNED_VERSION}" != "${FETCHED_VERSION}" ]; then
            echo "::error::api-contract.pin.json says contractVersion ${PINNED_VERSION}, but the pinned ref serves ${FETCHED_VERSION}."
            exit 1
          fi

      # ADVISORY, and the gap it closes is real: the check above is satisfied by
      # a hop of ANY size, because it only asserts the pinned contractVersion
      # equals the version the pinned ref serves. A 3.5.0 -> 3.7.0 bump passes
      # exactly as 3.5.0 -> 3.6.0 does, so a pull request described as adopting
      # one contract can carry several — and one of those carried an
      # authorization change that no gate and no description mentioned (#267).
      #
      # This prints every contract entry the bump crossed into the job summary.
      # It never fails: how many contracts a bump may cross is a judgement, and
      # a script answering it would make the agreement on the reviewer's behalf
      # — the same reason the API's own breaking-change differ is advisory.
      # `success()`, NOT `always()`: the step above exits 1 when the pin's
      # contractVersion disagrees with what its ref serves — the pin is
      # known-wrong — and reporting anyway hands a reviewer a confident
      # disclosure derived from a pin CI had just refused.
      - name: Report what the pin bump crossed
        if: success()
        continue-on-error: true
        # Raises the raw.githubusercontent rate limit off the shared runner IP,
        # the same reason and the same token the pin-check job uses. A valid
        # workflow token reads another PUBLIC repository's raw files fine —
        # verified from the dashboard's own copilot-ui-pin job, which reads
        # both FaultMaven/faultmaven-copilot and FaultMaven/faultmaven this
        # way. Without it the disclosure degrades to "unlisted" on precisely
        # the large hops that need it.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # THE MERGE BASE, not the base branch tip. A stacked pull request
            # whose parent already merged sees an identical pin on the tip and
            # reports nothing — the same silence a PR that moved no pin gives.
            git fetch --no-tags --depth=50 origin "${{ github.base_ref }}"
            BASE=$(git merge-base "origin/${{ github.base_ref }}" HEAD || echo "origin/${{ github.base_ref }}")
          else
            BASE="HEAD^"
          fi
          node scripts/report-contract-hop.mjs "${BASE}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Regenerate and compare
        env:
          FM_OPENAPI_SPEC: /tmp/openapi.json
        run: |
          pnpm run generate:api-types
          # `git status --porcelain`, not `git diff --exit-code`: the latter
          # reports nothing for an UNTRACKED path, so a pull request that
          # deleted the generated client would regenerate it here and pass
          # having compared the contract against nothing.
          if [ -n "$(git status --porcelain packages/copilot-ui/types/api.generated.ts)" ]; then
            echo "::error::packages/copilot-ui/types/api.generated.ts no longer matches the pinned API contract."
            echo ""
            echo "Regenerate and commit it:"
            echo "    pnpm generate:api-types"
            echo "    git add packages/copilot-ui/types/api.generated.ts"
            echo ""
            echo "If you are adopting a new contract, move \`ref\` in"
            echo "api-contract.pin.json in the same pull request — that is the"
            echo "commit where this client accepts the change."
            git --no-pager diff --stat packages/copilot-ui/types/api.generated.ts
            exit 1
          fi

  # ============================================================================
  # Stage 2: Run Tests
  # ============================================================================
  test:
    name: Run Tests
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Checkout only.
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm run test:coverage

      - name: Test summary
        if: success()
        run: |
          echo "### ✅ Tests Passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All tests completed successfully." >> $GITHUB_STEP_SUMMARY
          echo "Next: Building extension packages..." >> $GITHUB_STEP_SUMMARY

      - name: Test failure
        if: failure()
        run: |
          echo "### ❌ Tests Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Tests failed. Pipeline halted." >> $GITHUB_STEP_SUMMARY
          exit 1

  # ============================================================================
  # Stage 3: Build Extension Packages
  # ============================================================================
  build:
    name: Build Extension Packages
    needs: [lint, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Checkout plus actions/upload-artifact, which uploads through the runner's
    # own artifact service (it has no `github-token` input at all) — so the
    # upload does not draw on GITHUB_TOKEN.
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate icons
        run: pnpm run generate-icons

      # Package with `pnpm zip` — the same command release.yml ships with —
      # so CI exercises the artifact that actually reaches users, not a
      # hand-rolled equivalent. WXT names artifacts
      # faultmaven-copilot-<version>-<target>.zip from package.json.
      - name: Build and package Chrome extension
        run: pnpm zip

      - name: Build and package Firefox extension
        run: pnpm zip:firefox

      # package.json is the manifest version's only source (wxt.config.ts no
      # longer sets one), and WXT's fallback when it goes missing is a
      # warn-only 0.0.0 — so assert the derivation here, at PR time, rather
      # than discovering it at store upload.
      - name: Verify built manifest versions match package.json
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          CHROME_VERSION=$(node -p "require('./.output/chrome-mv3/manifest.json').version")
          FIREFOX_VERSION=$(node -p "require('./.output/firefox-mv2/manifest.json').version")
          echo "package.json=$PKG_VERSION chrome=$CHROME_VERSION firefox=$FIREFOX_VERSION"
          if [ "$CHROME_VERSION" != "$PKG_VERSION" ] || [ "$FIREFOX_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Built manifest version does not match package.json ($PKG_VERSION): chrome=$CHROME_VERSION firefox=$FIREFOX_VERSION"
            exit 1
          fi

      # Resubmission guard. The store reviews the ARTIFACT, so whether a change
      # needs a new version and an upload is a question about the built output,
      # not about which files the diff touched. Runs here because this job has
      # already produced that output with the same command release.yml ships.
      - name: Check the shipped artifact against its baseline
        run: pnpm extension:digest

      # The globs deliberately exclude the -sources.zip that `wxt zip -b
      # firefox` also emits.
      - name: Upload extension packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-packages
          path: |
            .output/faultmaven-copilot-*-chrome.zip
            .output/faultmaven-copilot-*-firefox.zip
          # .output/ is a dot-directory, which upload-artifact skips unless
          # told otherwise — without this the globs match nothing.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Build summary
        if: success()
        run: |
          echo "### ✅ Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Packages:" >> $GITHUB_STEP_SUMMARY
          for f in .output/faultmaven-copilot-*-chrome.zip .output/faultmaven-copilot-*-firefox.zip; do
            echo "- \`$(basename "$f")\`" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Next: Validating extension packages..." >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # Stage 4: Validate Extension Packages
  # ============================================================================
  validate:
    name: Validate Extension Packages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # No checkout and no API call: it downloads the artifact this same run
    # produced and unzips it. actions/download-artifact is scoped to the
    # current run unless given an explicit `github-token`/`run-id`, which it is
    # not here, so it needs no GITHUB_TOKEN scope. Nothing to grant.
    permissions: {}

    steps:
      - name: Download extension packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension-packages

      - name: Validate Chrome extension
        run: |
          echo "Validating Chrome extension..."
          unzip -q faultmaven-copilot-*-chrome.zip -d /tmp/chrome-ext
          
          # Check manifest.json exists
          if [ ! -f /tmp/chrome-ext/manifest.json ]; then
            echo "❌ manifest.json not found in Chrome extension"
            exit 1
          fi
          
          # Validate JSON syntax
          python3 -m json.tool /tmp/chrome-ext/manifest.json > /dev/null
          
          # Check required files
          if [ ! -f /tmp/chrome-ext/background.js ] && [ ! -f /tmp/chrome-ext/background/index.js ]; then
            echo "⚠️  Warning: No background script found"
          fi
          
          echo "✅ Chrome extension package is valid"

      - name: Validate Firefox extension
        run: |
          echo "Validating Firefox extension..."
          unzip -q faultmaven-copilot-*-firefox.zip -d /tmp/firefox-ext
          
          # Check manifest.json exists
          if [ ! -f /tmp/firefox-ext/manifest.json ]; then
            echo "❌ manifest.json not found in Firefox extension"
            exit 1
          fi
          
          # Validate JSON syntax
          python3 -m json.tool /tmp/firefox-ext/manifest.json > /dev/null
          
          # Check required files
          if [ ! -f /tmp/firefox-ext/background.js ] && [ ! -f /tmp/firefox-ext/background/index.js ]; then
            echo "⚠️  Warning: No background script found"
          fi
          
          echo "✅ Firefox extension package is valid"

      - name: Get package sizes
        run: |
          CHROME_SIZE=$(du -h faultmaven-copilot-*-chrome.zip | cut -f1)
          FIREFOX_SIZE=$(du -h faultmaven-copilot-*-firefox.zip | cut -f1)
          echo "Chrome package size: $CHROME_SIZE" >> $GITHUB_STEP_SUMMARY
          echo "Firefox package size: $FIREFOX_SIZE" >> $GITHUB_STEP_SUMMARY

      - name: Validation summary
        if: success()
        run: |
          echo "### ✅ Validation Passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Both extension packages are valid and ready for release." >> $GITHUB_STEP_SUMMARY

      - name: Validation failure
        if: failure()
        run: |
          echo "### ❌ Validation Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Extension package validation failed. Check logs above." >> $GITHUB_STEP_SUMMARY
          exit 1

  # ============================================================================
  # Stage 5: Security Scan (dependency audit, fail closed)
  # ============================================================================
  # This job was three layers of fail-open at once: `continue-on-error: true`
  # on the job, `|| echo` swallowing the audit's exit code, and the pipeline
  # summary deliberately excluding it from the gate. It could not go red for
  # any finding, at any severity — and on 2026-09-04 it was reporting five
  # high advisories while concluding success.
  #
  # It now fails closed on moderate, high and critical advisories (moderate
  # since faultmaven#2156). The job name is unchanged so anything that names
  # this check keeps naming it. The audit lives in .github/actions/lockfile-audit,
  # which the daily scheduled-audit.yml also runs against main
  # (faultmaven#2159), so both use one level. The action writes the job
  # summary for every outcome of the audit; a setup step that fails before it
  # shows only in that step's log.
  #
  # Escape hatch for a true positive with no upstream patch: add the GHSA id
  # to `pnpm.auditConfig.ignoreGhsas` in package.json, and give the reason in
  # the PR that adds it (package.json takes no comments). Measured at
  # `--audit-level high` on pnpm 9.15.9 against the lockfile #247 replaced:
  # ignoring the five high ids took the exit code to 0 and printed
  # `5 high (5 ignored)`, so the finding stays visible in the log. An ignore
  # names one advisory; it never widens the threshold.
  # ============================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Checkout plus `pnpm audit`, which queries the npm registry.
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json

      # No install step: `pnpm audit` resolves pnpm-lock.yaml directly, so the
      # audited set is the lockfile rather than whatever a fresh resolution
      # happened to produce. `pnpm install --frozen-lockfile` is still
      # exercised by lint, test and build.
      #
      # Verified to bite when introduced at `--audit-level high` (#247): against
      # the lockfile #247 replaced it exited 1 (5 high); against its own
      # lockfile it exited 0.
      # Moderate since faultmaven#2156: against 6665bad's lockfile (@vitest/mocker
      # 4.1.11, two moderates) the audit exits 1; `--audit-level high` exited 0.
      # The action retries while npm's advisory endpoint is unreachable, failing
      # (5xx, 408, 429) or stalled (90 s per attempt), and `fail` keeps this gate
      # closed if that lasts all four attempts.
      - name: Audit lockfile (moderate and above, fail closed)
        uses: ./.github/actions/lockfile-audit
        with:
          on-unreachable: fail

  # ============================================================================
  # Pipeline Summary
  # ============================================================================
  summary:
    name: Pipeline Summary
    needs: [lint, api-types-drift, test, build, validate, security]
    if: always()
    runs-on: ubuntu-24.04
    # 60 green runs to 2026-10-23 top out at 5s; the floor is 5m.
    timeout-minutes: 5
    # Reads `needs.*.result` (workflow context, not an API scope) and writes
    # $GITHUB_STEP_SUMMARY. No checkout, no API call.
    permissions: {}

    steps:
      - name: Pipeline summary
        run: |
          echo "### 📊 CI/CD Pipeline Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint & Type Check | ${{ needs.lint.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| API Types Drift | ${{ needs['api-types-drift'].result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | ${{ needs.test.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Validate | ${{ needs.validate.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.validate.result }}" = "success" ]; then
            echo "✅ Extension packages are ready for release." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "To create a release, push a tag matching package.json's version:" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "git tag v<version>   # must equal package.json's version — release.yml enforces this" >> $GITHUB_STEP_SUMMARY
            echo "git push origin v<version>" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Fail if any required stage failed
        # `summary` runs with `if: always()` so the table is written even when an
        # earlier stage fails — but without this the job, named "Pipeline
        # Summary", would still *conclude* success for a failed pipeline. That
        # is the fail-open shape this table exists to avoid: an aggregate check
        # announcing success for stages it merely reported on.
        # SECURITY is in this list. Leaving it out would hand back the
        # fail-open the audit job just gave up: the audit would go red and
        # this aggregate, the job that reads as "did the pipeline pass",
        # would still conclude success.
        env:
          LINT: ${{ needs.lint.result }}
          API_TYPES_DRIFT: ${{ needs['api-types-drift'].result }}
          TEST: ${{ needs.test.result }}
          BUILD: ${{ needs.build.result }}
          VALIDATE: ${{ needs.validate.result }}
          SECURITY: ${{ needs.security.result }}
        run: |
          rc=0
          for stage in LINT API_TYPES_DRIFT TEST BUILD VALIDATE SECURITY; do
            result="${!stage}"
            # `skipped` is a pass: a stage skipped on purpose (the `skip_tests`
            # dispatch input) must not fail the pipeline, and a stage skipped
            # because an upstream one failed is already accounted for — that
            # upstream stage reports `failure` and is itself in this list.
            case "$result" in
              success|skipped) ;;
              *)
                echo "::error::$stage did not pass (result: $result)"
                rc=1
                ;;
            esac
          done
          exit $rc
