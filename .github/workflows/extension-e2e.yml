name: Extension E2E Tests
on:
  workflow_dispatch:                    # Manual trigger
  # Deliberately UNFILTERED, unlike the push trigger below.
  #
  # This workflow could not gate anything until now: with no `pull_request`
  # trigger it never reported on a pull request, so it could not be a required
  # check even in principle. #240 broke the side panel and merged green, and
  # main stayed red for two days with nothing to catch it.
  #
  # A `paths:` filter here would put it straight back in that position. A
  # filtered workflow does not run when the paths do not match, and a required
  # check that never runs never reports — which blocks every PR that does not
  # touch those paths, rather than letting it through. Requiring a context is
  # only safe when the context always arrives.
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'src/**'
      # The shared UI, which is most of what the panel renders. Absent until
      # now, so a change confined to the package — the regression FIX for #251
      # is one — reached main without this suite ever running on it.
      - 'packages/**'
      - 'public/**'
      - 'manifest.json'
      - 'e2e/**'
  schedule:
    - cron: '0 6 * * 1'                # Weekly Monday 6am UTC

# One run per ref. Now that this fires on every pull request regardless of
# paths, a branch pushed several times in a row would otherwise leave that many
# full runs racing — each a build plus a Chromium download — and the superseded
# ones are already answering a question nobody is asking. Cancelling them is
# safe for a required check: required contexts are evaluated against the head
# commit's run, and cancelling a run on a SUPERSEDED commit cannot affect it.
concurrency:
  group: extension-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  extension-e2e:
    runs-on: ubuntu-24.04
    # Checkout, pnpm install, `wxt build`, a Playwright browser download, and
    # actions/upload-artifact for traces on failure. The registry and browser
    # CDN are unauthenticated; upload-artifact uses the runner's artifact
    # service rather than GITHUB_TOKEN. Read is all that is used.
    permissions:
      contents: read
    # The only workflow here that was unbounded, so a hung step ran until
    # GitHub's 6-hour default. Measured healthy execution is ~90s; the
    # slowest successful run was ~7min (browser download variance), so 20
    # leaves ~3x headroom and matches release.yml, the heaviest job here.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10
          
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 20
          cache: 'pnpm'
          
      - run: pnpm install
      
      - run: pnpm build                        # Build the extension
      
      - run: pnpm exec playwright install chromium --with-deps
      
      - run: xvfb-run pnpm test:e2e
      
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-traces
          path: e2e/test-results/
