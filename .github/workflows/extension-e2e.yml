name: Extension E2E Tests
on:
  workflow_dispatch:                    # Manual trigger
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'manifest.json'
      - 'e2e/**'
  schedule:
    - cron: '0 6 * * 1'                # Weekly Monday 6am UTC

jobs:
  extension-e2e:
    runs-on: ubuntu-latest
    # The only workflow here that was unbounded, so a hung step ran until
    # GitHub's 6-hour default. Measured healthy execution is ~90s; the
    # slowest successful run was ~7min (browser download variance), so 20
    # leaves ~3x headroom and matches release.yml, the heaviest job here.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      
      - uses: pnpm/action-setup@v5
        with:
          version: 10
          
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'pnpm'
          
      - run: pnpm install
      
      - run: pnpm build                        # Build the extension
      
      - run: pnpm exec playwright install chromium --with-deps
      
      - run: xvfb-run pnpm test:e2e
      
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-traces
          path: e2e/test-results/
