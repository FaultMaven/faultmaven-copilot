# Dependabot configuration: version updates for the GitHub Actions in
# .github/ only. Security alerts for npm dependencies arrive without any
# config here; the daily lockfile audit (scheduled-audit.yml) gates them.
version: 2
updates:
  # Every action in .github/ is pinned to a commit sha with its release in a
  # comment. Dependabot raises no security alert for an action pinned that
  # way, so this entry is the only signal that one has a new release, fixes
  # included. It updates the sha and the version comment together. At most
  # two pull requests a week: majors are grouped apart, so a breaking major
  # cannot hold back a patch.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      actions-major:
        patterns: ["*"]
        update-types: ["major"]
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
